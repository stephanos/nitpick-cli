[agent]
provider = "claude"
# model = "claude-opus-4-6"
# command = "claude"
sandbox = "nono"

# To use Codex instead:
# provider = "codex"
# model = "gpt-5.3-codex"
# command = "codex"

[reviews]
max_concurrent = 3
# Paths may be relative to this config file or absolute.
# Optional paths to files with user guidance appended to every review prompt.
extra_prompt_paths = []
# Optional paths to guidance appended only to local self-review prompts.
self_review_extra_prompt_paths = []
# Optional paths to guidance appended only to requested-review prompts.
requested_review_extra_prompt_paths = []

[github]
command = "gh"
discovery = false
auto_review = false
interval_seconds = 60
# Only discover review requests whose repository matches one of these patterns.
# Empty allowlist means all repositories are allowed. Patterns match "owner/repo".
# Examples: "acme/platform", "acme/*".
allowlist = []
# Exclude review requests whose repository matches one of these patterns.
# Denylist is applied after allowlist, so a deny match always wins.
# Examples: "*/archive-*", "legacy/*".
denylist = []
